name: Daily earnings digest

on:
  schedule:
    # 06:00 UTC = 08:00 Warsaw (CET, winter). During CEST (summer) this is
    # 08:00 UTC+2... i.e. 08:00 becomes 06:00 UTC only in winter; adjust this
    # cron by hand around the March/October DST switch if 08:00 Warsaw matters
    # year-round.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  send-digest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run digest bot
        env:
          FINNHUB_TOKEN: ${{ secrets.FINNHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: go run ./cmd/bot
